name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, phase-5a-attempt-persistence, phase-5b-practice-history]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck Orval configurations
        run: pnpm exec tsc -p lib/api-spec/tsconfig.codegen.json

      - name: Frontend tests
        run: pnpm --filter @workspace/ccna-learning test

      # DB integration suites intentionally require RUN_DB_TESTS=1 and a
      # DATABASE_URL. CI does not expose the production Neon database to PRs.
      - name: API tests (non-DB)
        run: pnpm --filter @workspace/api-server exec vitest run --exclude '**/*.db.test.ts'

      - name: Build production application
        run: pnpm --filter @workspace/api-server run build && PORT=8080 BASE_PATH=/ pnpm --filter @workspace/ccna-learning run build
